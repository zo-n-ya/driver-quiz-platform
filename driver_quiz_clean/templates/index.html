<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>POD Test</title><link rel="stylesheet" href="/static/css/style.css"></head><body><main class="app-shell">
<section id="screenStart" class="screen active"><div class="hero-card start-card"><a class="admin-entry" href="/admin/dashboard">Admin</a><h1 id="appTitle">POD测试</h1><p id="appIntro" class="muted">请填写信息开始测试。</p><label id="labelDriver">司机号</label><input id="driverId" class="input" placeholder="司机号"><label id="labelWarehouse">仓库</label><select id="warehouse" class="input"><option selected>31 ATL</option><option>44 SAV</option><option>46 CHS</option><option>50 BNA</option><option>60 TYS</option><option>61 GSP</option><option>62 CAE</option><option>66 BFM</option><option>67 BHM</option><option>76 JAN</option><option>81 GPT</option></select><label id="labelTeam">车队号</label><input id="teamId" class="input" placeholder="Team ID"><label id="labelLanguage">语言</label><div class="segmented" id="languageButtons"><button data-lang="zh" class="active">中文</button><button data-lang="en">English</button><button data-lang="es">Español</button></div><label id="labelReason">考试原因</label><div class="segmented reason" id="reasonButtons"><button data-reason="caught" class="active">POD 被查到不合格</button><button data-reason="retake">未满分补考</button></div><button id="goCategory" class="primary">开始考试</button></div></section>
<section id="screenCategory" class="screen"><div class="hero-card"><button class="back" data-back="start">‹</button><h2 id="categoryTitle">选择错误类别</h2><div id="categoryList" class="list"></div></div></section>
<section id="screenRules" class="screen"><div class="hero-card"><button class="back" data-back="category">‹</button><h2 id="rulesTitle">考试规则</h2><div class="rule-box"><p id="rule1">每套题必须全部答对才算通过。</p><p id="rule2">Quiz #1 没满分后进入 Quiz #2，直到 Quiz #5。</p><p id="rule3">五套都没满分后进入随机题模式。</p></div><label class="checkline"><input type="checkbox" id="ruleAgree"> <span id="agreeText">我已阅读并理解规则</span></label><button id="startExam" class="primary">开始考试</button></div></section>
<section id="screenQuiz" class="screen"><div class="quiz-card"><div class="quiz-top"><span id="progressText">1 / 7</span><span id="stageBadge"></span></div><div id="questionBox"></div><div class="nav-row"><button id="prevQuestion" class="secondary">上一题</button><button id="nextQuestion" class="primary">下一题</button></div></div></section>
<section id="screenResult" class="screen"><div class="hero-card center"><div id="resultIcon" class="result-icon">✓</div><h2 id="resultTitle">完成</h2><p id="resultScore" class="score-line"></p><button id="reviewBtn" class="secondary">查看答案反馈</button><button id="nextSetBtn" class="primary hidden">下一套</button><button id="homeBtn" class="primary hidden">返回首页</button></div></section>
<section id="screenReview" class="screen"><div class="review-header"><button class="back" data-back="result">‹</button><h2 id="reviewTitle">答案反馈</h2><p id="reviewScore"></p></div><div id="reviewList"></div></section>
</main><div id="toast" class="toast hidden"></div><script src="/static/js/app.js"></script></body></html>
