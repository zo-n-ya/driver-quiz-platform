<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Question Bank Login</title><link rel="stylesheet" href="/static/css/style.css"><link rel="stylesheet" href="/static/css/admin.css"></head>
<body><main class="admin-shell"><section class="admin-card login-card"><h1>Question Bank</h1><p class="muted">Enter question bank password</p>{% if error %}<div class="admin-error">{{ error }}</div>{% endif %}<form method="post"><input class="input" type="password" name="password" placeholder="Password" autofocus><label class="remember-line"><input type="checkbox" name="remember" value="yes"> Remember password on this device</label><button class="primary" type="submit">Login</button></form><p class="muted small-note">This login is separate from the operations dashboard.</p></section></main></body></html>
